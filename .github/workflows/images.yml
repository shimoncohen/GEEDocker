name: images

on:
  push:
    branches: [master]
  pull_request:
  workflow_run:
    workflows: [geebuild]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: geeserver
            paths: server
          - name: geefusion
            paths: fusion ':!fusion/ssh'
          - name: geefusion-ssh
            paths: fusion/ssh
          - name: geeclient
            paths: geeClient
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          PATHS: ${{ matrix.paths }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...HEAD" ;;
            push) range="$BEFORE..HEAD" ;;
            *) range="" ;;
          esac
          eval "set -- $PATHS"
          if [ -z "$range" ] || ! git rev-parse -q --verify "${range%%.*}^{commit}" >/dev/null; then
            build=true
          elif [ "$EVENT" = push ] && ! git diff --quiet "$range" -- geeBuild; then
            # The geebuild workflow publishes a new base first, then re-triggers this one.
            build=false
          elif git diff --quiet "$range" -- "$@" .github/workflows/images.yml; then
            build=false
          else
            build=true
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "range=$range build=$build"

      - name: Resolve image names
        if: steps.changes.outputs.build == 'true'
        id: img
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "base=$registry/geebuild:$(grep -oP '^ARG TAG="\K[^"]+' geeBuild/Dockerfile)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.7.0
        if: steps.changes.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Plain docker build, not buildx: fusion/tutorial must see the geefusion image built just before it.
      - name: Build
        if: steps.changes.outputs.build == 'true'
        env:
          NAME: ${{ matrix.name }}
          BASE: ${{ steps.img.outputs.base }}
        run: |
          case "$NAME" in
            geeserver) docker build --build-arg BASE_IMAGE="$BASE" --build-arg IP=localhost -t "$NAME" server ;;
            geefusion)
              docker build --build-arg BASE_IMAGE="$BASE" -t "$NAME" fusion
              docker build --build-arg BASE_IMAGE="$NAME" -t fusiontutorial fusion/tutorial ;;
            geefusion-ssh) docker build --build-arg BASE_IMAGE="$BASE" -t "$NAME" fusion/ssh ;;
            geeclient) docker build -t "$NAME" geeClient ;;
          esac

      - name: Smoke test credentials
        if: steps.changes.outputs.build == 'true' && (matrix.name == 'geeserver' || matrix.name == 'geefusion-ssh')
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -u
          rc=0; timeout -k 10 120 docker run --name nocred "$NAME" || rc=$?
          docker rm -f nocred >/dev/null
          [ "$rc" = 1 ] || { echo "::error::$NAME without its credential file exited $rc, expected 1"; exit 1; }
          secrets="$RUNNER_TEMP/secrets"
          mkdir -p "$secrets"
          if [ "$NAME" = geeserver ]; then
            openssl rand -hex 16 > "$secrets/gee_admin_password"
            docker run -d --name smoke -p 127.0.0.1:8081:80 -v "$secrets/gee_admin_password:/run/secrets/gee_admin_password:ro" "$NAME"
            url=http://127.0.0.1:8081/admin/
            for _ in $(seq 60); do [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 401 ] && break; sleep 5; done
            code() { curl -s -o /dev/null -w '%{http_code}' "$@" "$url"; }
            [ "$(code)" = 401 ] || { echo "::error::/admin/ without credentials did not return 401"; docker logs smoke; exit 1; }
            [ "$(code -u geapacheuser:geeadmin)" = 401 ] || { echo "::error::upstream default password still accepted"; exit 1; }
            [ "$(code -u "geapacheuser:$(cat "$secrets/gee_admin_password")")" = 200 ] || { echo "::error::configured admin password rejected"; docker logs smoke; exit 1; }
          else
            ssh-keygen -q -t ed25519 -N '' -f "$secrets/key"
            docker run -d --name smoke -p 127.0.0.1:30022:22 -v "$secrets/key.pub:/run/secrets/authorized_keys:ro" "$NAME"
            opts=(-o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 -p 30022)
            for _ in $(seq 30); do ssh-keyscan -p 30022 127.0.0.1 >/dev/null 2>&1 && break; sleep 2; done
            ssh "${opts[@]}" -i "$secrets/key" root@127.0.0.1 true || { echo "::error::key login failed"; docker logs smoke; exit 1; }
            # The "none" method makes sshd list every login method it would accept.
            offered=$(ssh "${opts[@]}" -o PreferredAuthentications=none root@127.0.0.1 true 2>&1 || true)
            [[ "$offered" == *"Permission denied (publickey)."* ]] || { echo "::error::expected key-only login, got: $offered"; exit 1; }
          fi
          docker rm -f smoke

      - name: Push
        if: steps.changes.outputs.build == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          NAME: ${{ matrix.name }}
          REGISTRY: ${{ steps.img.outputs.registry }}
        run: |
          images="$NAME"
          [ "$NAME" = geefusion ] && images="$images fusiontutorial"
          for image in $images; do
            for tag in master "sha-${GITHUB_SHA::7}"; do
              docker tag "$image" "$REGISTRY/$image:$tag"
              docker push "$REGISTRY/$image:$tag"
            done
          done
