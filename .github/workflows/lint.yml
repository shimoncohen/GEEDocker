name: lint

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      # Errors only: the existing files still carry many warnings.
      - name: hadolint
        run: |
          for f in $(git ls-files '*Dockerfile'); do
            echo "== $f"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < "$f" || rc=1
          done
          exit "${rc:-0}"

      - name: shellcheck
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 -S error

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -no-color
